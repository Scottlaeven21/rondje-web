<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Betaald — Rondje</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; background: #FFFBEB; color: #0F172A; }
    .card { background: #fff; border-radius: 20px; padding: 32px 28px; max-width: 360px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: #64748B; line-height: 1.5; margin: 0; }
    .ok { width: 56px; height: 56px; border-radius: 28px; background: #10B981; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="../assets/logo-mark.svg" alt="Rondje" width="56" height="56" style="border-radius:16px" />
    <div class="ok">✓</div>
    <h1>Bedankt!</h1>
    <p>Je betaling is gelukt — ook als je via Klarna later betaalt. Je deel van de avondrekening staat goed bij Rondje.</p>
  </div>
</body>
</html>
