<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rondje logo">
  <defs>
    <linearGradient id="rondjeGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Afgeronde vierkant-achtergrond in de merkgradient -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#rondjeGrad)"/>

  <!-- "Rondje geven" = twee klinkende glazen -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Linkerglas (tuimelt naar rechts) -->
    <g transform="rotate(-13 50 84)">
      <path d="M37 44 H63 L59 84 H41 Z" fill="rgba(255,255,255,0.22)"/>
      <path d="M40 66 H60" stroke-width="5"/>
    </g>
    <!-- Rechterglas (tuimelt naar links) -->
    <g transform="rotate(13 78 84)">
      <path d="M65 44 H91 L87 84 H69 Z" fill="rgba(255,255,255,0.22)"/>
      <path d="M68 66 H88" stroke-width="5"/>
    </g>
  </g>

  <!-- Klink-vonken op het raakpunt -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
    <path d="M64 30 V20"/>
    <path d="M52 33 L46 25"/>
    <path d="M76 33 L82 25"/>
  </g>
</svg>
